<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d9f6e" />
  <meta name="description" content="Podjela troškova padel terena — s PassSport karticama." />
  <title>PadelSplit</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <div class="logo">Padel<span>Split</span></div>
      <div class="club" id="clubName">…</div>
    </div>
  </header>

  <main>
    <section class="card">
      <div class="label">Teren</div>
      <div id="courts" class="chips-row"></div>

      <div class="label">Trajanje</div>
      <div id="durations" class="chips-row"></div>

      <div class="label">Početak termina <span class="hint">(izračunato — podesi po potrebi)</span></div>
      <div class="time-row">
        <button id="startMinus" class="step-btn" aria-label="30 minuta ranije">−30</button>
        <input id="startTime" type="time" step="1800" />
        <button id="startPlus" class="step-btn" aria-label="30 minuta kasnije">+30</button>
      </div>

      <div class="label">Cijena terena</div>
      <div class="price-line">
        <input id="priceInput" class="price-input" type="number" inputmode="decimal" step="0.5" min="0" placeholder="0" />
        <span class="eur">&euro;</span>
      </div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2>Igrači</h2>
        <button id="addPlayer" class="ghost-btn">+ Igrač</button>
      </div>
      <div id="players"></div>
    </section>

    <section class="card">
      <div class="section-head"><h2>Koliko tko plaća</h2></div>
      <div id="result" class="result"></div>
    </section>

    <p class="footnote">PassSport: prvih 60 min udjela te osobe je besplatno.</p>
  </main>

  <script src="./app.js"></script>
</body>
</html>
